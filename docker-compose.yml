services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-https://pengaduan.kemenag-baritoutara.com}
        - PUBLIC_SITE_NAME=${PUBLIC_SITE_NAME:-SI-GESIT — Pengaduan Masyarakat Kemenag Barito Utara}
        - PUBLIC_TURNSTILE_SITE_KEY=${PUBLIC_TURNSTILE_SITE_KEY:-}
        - PUBLIC_GA_MEASUREMENT_ID=${PUBLIC_GA_MEASUREMENT_ID:-}
        - PUBLIC_GTAG_ID=${PUBLIC_GTAG_ID:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s