services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-https://pengaduan.kemenag-baritoutara.com}
        - PUBLIC_SITE_NAME=${PUBLIC_SITE_NAME:-SI-GESIT — Pengaduan Masyarakat Kemenag Barito Utara}
        - PUBLIC_TURNSTILE_SITE_KEY=${PUBLIC_TURNSTILE_SITE_KEY}
        - PUBLIC_GA_MEASUREMENT_ID=${PUBLIC_GA_MEASUREMENT_ID:-G-56V7KYCD71}
        - PUBLIC_GTAG_ID=${PUBLIC_GTAG_ID:-GT-T5RE5PM8}
    restart: unless-stopped
    env_file: ./.env.local
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s